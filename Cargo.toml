[package]
name = "aerospace-tree-dot"
version = "0.1.0"
authors = ["Sam Stokes <me@samstokes.co.uk>"]
edition = "2018"

[[bin]]
name = "aerospace-tree-dot"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
env_logger = "0.11"
eyre = "0.6"
log = "0.4"
petgraph = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
